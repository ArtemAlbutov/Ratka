<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>До конца года</title>
</head>
<body>
    <div id="output"></div>
    <script>
        function plural(n, one, few, many) {
            if (n % 10 === 1 && n % 100 !== 11) return n + " " + one;
            if (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) return n + " " + few;
            return n + " " + many;
        }

        function update() {
            const now = new Date();
            const endOfYear = new Date(now.getFullYear() + 1, 0, 1, 0, 0, 0, 0);
            let diff = endOfYear - now;
            if (diff < 0) diff = 0;

            const days = Math.floor(diff / 86400000); diff -= days * 86400000;
            const hours = Math.floor(diff / 3600000); diff -= hours * 3600000;
            const minutes = Math.floor(diff / 60000);

            const result =
                plural(days, "день", "дня", "дней") + ", " +
                plural(hours, "час", "часа", "часов") + ", " +
                plural(minutes, "минута", "минуты", "минут");

            document.title = result;
            document.getElementById("output").textContent = result;
        }

        update();
        setInterval(update, 1000);
    </script>
</body>
</html>
